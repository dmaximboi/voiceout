worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  server_tokens off;
  default_type application/octet-stream;
  client_max_body_size 42m;
  client_header_timeout 10s;
  client_body_timeout 20s;
  send_timeout 30s;
  keepalive_timeout 15s;
  reset_timedout_connection on;
  large_client_header_buffers 4 8k;
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Outer TLS terminator (Cloudflare / cloud LB) may send https while we listen on HTTP.
  map $http_x_forwarded_proto $edge_proto {
    default $scheme;
    https   https;
    http    http;
  }

  limit_req_zone $binary_remote_addr zone=web:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api:10m rate=12r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Reverse proxy + least_conn. Scale later with extra `server` lines (or Cloudflare in front).
  upstream web {
    least_conn;
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }
  upstream api {
    least_conn;
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  server {
    listen 2005;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-Id $request_id always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header X-XSS-Protection "0" always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_intercept_errors on;

    location = /healthz {
      default_type application/json;
      return 200 '{"ok":true,"edge":true}';
    }

    location /vo-api/auth/ {
      limit_req zone=auth burst=10 nodelay;
      limit_conn addr 12;
      proxy_pass http://api/auth/;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Connection "";
    }

    location /vo-api/ {
      limit_req zone=api burst=24 nodelay;
      limit_conn addr 20;
      proxy_pass http://api/;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Connection "";
    }

    location / {
      limit_req zone=web burst=40 nodelay;
      limit_conn addr 24;
      proxy_pass http://web;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    error_page 429 /_edge_busy;
    error_page 502 503 504 /_edge_down;
    location = /_edge_busy {
      internal;
      default_type application/json;
      return 429 '{"error":"Too many requests"}';
    }
    location = /_edge_down {
      internal;
      default_type application/json;
      return 502 '{"error":"Unavailable"}';
    }
  }
}
