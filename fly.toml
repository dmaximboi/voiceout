# VoiceOut API → Fly.io
# Deploy from repo root: fly deploy
# App name: change if taken.

app = "voiceout-api"
primary_region = "fra"

[build]
  dockerfile = "infra/Dockerfile.node"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "10s"
    protocol = "http"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
