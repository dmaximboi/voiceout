# VoiceOut backend workers → Render
# Connect this repo in Render Dashboard → Blueprint, or create a Docker web service manually.
# Root Directory: leave EMPTY (repo root). Do not put "apps/backend" or command fragments there.

services:
  - type: web
    name: voiceout-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/Dockerfile.node
    # Render UI only allows [A-Za-z0-9-_./ ] — no $, {}, ", or @
    dockerCommand: pnpm --dir apps/backend start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
