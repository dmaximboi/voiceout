# VoiceOut backend workers → Render
# Connect this repo in Render Dashboard → Blueprint, or create a Docker worker manually.

services:
  - type: web
    name: voiceout-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/Dockerfile.node
    dockerCommand: sh -c "BACKEND_PORT=${PORT:-4001} pnpm --filter @voiceout/backend start"
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
