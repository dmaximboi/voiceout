name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build production web
        run: pnpm --filter @voiceout/web build
        env:
          API_ORIGIN: http://127.0.0.1:4000
          NEXT_PUBLIC_API_URL: /vo-api
          NEXT_PUBLIC_WEB_ORIGIN: http://127.0.0.1:3000
      - name: Audit production dependencies (critical)
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "pnpm audit attempt ${attempt}/3"
            out="$(pnpm audit --prod --audit-level=critical 2>&1)"
            code=$?
            echo "$out"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            # pnpm exits 1 for vulns and for registry network errors.
            if echo "$out" | grep -qiE 'ERR_SOCKET_TIMEOUT|ECONNRESET|ENOTFOUND|ETIMEDOUT|FetchError'; then
              echo "Registry audit timed out (attempt ${attempt}); retrying..."
              sleep $((attempt * 15))
              continue
            fi
            if echo "$out" | grep -qiE 'vulnerabilit|Severity:'; then
              echo "Critical vulnerabilities reported by audit"
              exit 1
            fi
            echo "Audit failed without a clear vulnerability report (attempt ${attempt}); retrying..."
            sleep $((attempt * 15))
          done
          echo "Skipping audit gate: npm registry unreachable after retries"
          exit 0

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/algo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy configs
        run: |
          python - <<'PY'
          import json, pathlib, tomllib
          json.load(open("apps/web/vercel.json", encoding="utf-8"))
          with open("fly.toml", "rb") as f:
              tomllib.load(f)
          with open("apps/algo/railway.toml", "rb") as f:
              tomllib.load(f)
          # render.yaml is YAML; basic presence check
          text = pathlib.Path("render.yaml").read_text(encoding="utf-8")
          assert "voiceout-backend" in text
          assert "infra/Dockerfile.node" in text
          print("deploy configs ok")
          PY
      - name: Validate compose configuration
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config --quiet
      - name: Validate smoke scripts
        shell: bash
        run: |
          bash -n scripts/smoke.sh
          pwsh -NoProfile -Command '$errors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/smoke.ps1", [ref]$null, [ref]$errors); if ($errors.Count) { $errors | Write-Error; exit 1 }'
